<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>URBAN OVIEDO — Enlaces oficiales</title>
  <meta name="description" content="Tienda de ropa urbana en Oviedo. Tienda online, Instagram, TikTok, WhatsApp, cómo llegar y reseñas reales de clientes." />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Open Graph -->
  <meta property="og:title" content="URBAN OVIEDO STORE" />
  <meta property="og:description" content="Ropa urbana en Oviedo — Tienda online · Instagram · TikTok · WhatsApp · Reseñas 5★" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css" />

  <!-- SEO: Schema.org AggregateRating (estrellitas en Google) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ClothingStore",
    "name": "Urban Oviedo Store",
    "image": "https://urban-oviedo-links.vercel.app/og.jpg",
    "url": "https://urbanoviedostore.es/",
    "telephone": "+34696641381",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Calle Nueve de Mayo, 15",
      "addressLocality": "Oviedo",
      "addressRegion": "Asturias",
      "postalCode": "33002",
      "addressCountry": "ES"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "5.0",
      "reviewCount": "3",
      "bestRating": "5"
    },
    "review": [
      {"@type":"Review","author":{"@type":"Person","name":"Francisco Díaz"},"reviewRating":{"@type":"Rating","ratingValue":"5","bestRating":"5"},"reviewBody":"Mi tienda de ropa de moda favorita, trato fabuloso, marcas de ropa muy top, pedidos a Madrid en un día, atención de 10, siempre pendiente a cualquier duda, sitio ideal para comprar. Recomendado 100%."},
      {"@type":"Review","author":{"@type":"Person","name":"Angel Torres Romero"},"reviewRating":{"@type":"Rating","ratingValue":"5","bestRating":"5"},"reviewBody":"Tienda de ropa con las mejores marcas de moda de últimas tendencias como Antonio Morato, Karl Lagerfeld, My Brand, Dsquared2, y su marca propia Savage."},
      {"@type":"Review","author":{"@type":"Person","name":"Guillermo Leon Brufau"},"reviewRating":{"@type":"Rating","ratingValue":"5","bestRating":"5"},"reviewBody":"La tienda está muy bien, incluso las compras de ropa por internet. Te orientan con las tallas y son muy amables, en caso de tener que realizar un cambio ellos se ocupan de gestionarlo."}
    ]
  }
  </script>
</head>
<body>
  <main>
    <!-- HERO -->
    <header class="hero">
      <div class="logo-badge" aria-hidden="true">
        <div><span>URBAN</span><span>OVIEDO</span></div>
      </div>
      <div>
        <h1>URBAN OVIEDO STORE</h1>
        <p class="tagline">Ropa urbana · Oviedo</p>
      </div>
      <div class="status-row">
        <span class="chip chip--rating" aria-label="Valoración 5 sobre 5 en Google">
          <span class="stars">★★★★★</span> 5,0 <span class="dot" style="opacity:.4"></span> Google
        </span>
        <span id="open-chip" class="chip" aria-live="polite">Cargando…</span>
      </div>
    </header>

    <!-- ACCIONES PRINCIPALES -->
    <nav class="primary-actions" aria-label="Acciones principales">
      <a id="action-shop" class="btn btn--accent" target="_blank" rel="noopener">Tienda</a>
      <a id="action-wa" class="btn btn--wa" target="_blank" rel="noopener">WhatsApp</a>
    </nav>

    <!-- MARCAS -->
    <section class="brands" aria-label="Marcas disponibles">
      <h2>Marcas destacadas</h2>
      <ul id="brand-list"></ul>
    </section>

    <!-- ENLACES SECUNDARIOS -->
    <nav class="links" id="link-list" aria-label="Redes y contacto"></nav>

    <!-- RESEÑAS -->
    <section class="reviews" aria-labelledby="reviews-title">
      <div class="reviews-head">
        <h2 id="reviews-title">Lo que dicen</h2>
        <span id="reviews-count" class="count"></span>
      </div>
      <div id="review-list"></div>
      <a class="link" id="review-cta" target="_blank" rel="noopener"></a>
    </section>

    <!-- ACCIONES SECUNDARIAS -->
    <div class="utility">
      <button id="btn-share" class="ghost" type="button"></button>
      <button id="btn-copy" class="ghost" type="button"></button>
      <button id="btn-install" class="ghost" type="button" hidden></button>
    </div>

    <footer>© Urban Oviedo Store · <a href="https://urbanoviedostore.es/" target="_blank" rel="noopener">urbanoviedostore.es</a></footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
